-- \n\n## 생성된 링크를 어떻게 사용하나요?\n\n### 1. Markdown 문법 사용하기\n\nNA-Log는 Github-Flavored-Markdown 문법을 지원합니다. \\\nMarkdown 문법을 사용하면 간단하게 이미지를 첨부할 수 있습니다.\n\n```bash\n![비둘기..?](https://github.com/nerd-animals/na-log-engine/assets/56672129/e4ea21ae-0d7b-49cc-a0b2-517e73925134) # ![alt](src)\n```\n\n![비둘기?](https://github.com/nerd-animals/na-log-engine/assets/56672129/e4ea21ae-0d7b-49cc-a0b2-517e73925134)\n\n### 2. \\\u003cimg\u003e 태그 사용하기\n\n\\\u003cimg\u003e 태그를 사용해서 이미지를 첨부할 수 있습니다. \\\nMarkdown 문법보다 더욱 다양한 옵션을 사용할 수 있습니다. 관련 정보는 [MDN Web Docs](https://developer.mozilla.org/ko/docs/Web/HTML/Element/img)를 참고하세요 😊\n\n```bash\n\u003cimg src=\"https://github.com/nerd-animals/na-log-engine/assets/56672129/e4ea21ae-0d7b-49cc-a0b2-517e73925134\" alt=\"비둘기?\" /\u003e\n```\n\u003cimg src=\"https://github.com/nerd-animals/na-log-engine/assets/56672129/e4ea21ae-0d7b-49cc-a0b2-517e73925134\" alt=\"비둘기?\" /\u003e\n----\n\nNA-Log에서 이미지를 첨부하는 방법에 대해 소개해드렸습니다. \\\n문의 사항이 있으시다면, 댓글 남겨주세요! 👍\n\n감사합니다 :) 🦝"])</script><script>self.__next_f.push([1,"f:[\"na-log\",\"demo\",\"image\",\"gif\"]\n10:[\"how-to\",\"0-image\"]\ne:{\"title\":\"Image in NA-Log\",\"summary\":\"NA-Log에서 Image/Gif를 첨부하는 방법입니다.\",\"author\":\"raccoon\",\"tags\":\"$f\",\"date\":\"2024-3-7\",\"slug\":\"$10\"}\n11:T819,"])</script><script>self.__next_f.push([1,"\n### 안녕하세요, Nerd-Animals의 raccoon입니다 🦝\n\n블로그 포스팅에서 이미지/움짤(?) 첨부는 필수입니다. \\\n이번 포스팅에서는 저희가 사용 중인 **Image 첨부 방법**에 대해 소개합니다 😀\n\n----\n\n## 파일은 어디에 저장하나요?\n\n파일은 Github에 업로드해서 사용합니다. \\\nGithub에 무료로 파일을 저장할 수 있고, 빠르게 이미지 링크를 얻을 수 있습니다.\n\n![Github에서 이미지 링크 얻기](https://github.com/nerd-animals/na-log-engine/assets/56672129/32024890-28f1-4207-8cb9-6a059da5cd8e)\n\n1. `New Issue`를 이용해서 Text Box를 켭니다.(Issue가 아니어도 됩니다.)\n2. 파일을 Drag \u0026 Drop 합니다. (이미지 파일은 Copy \u0026 Paste도 가능합니다!)\n3. 생성된 링크를 사용합니다! 🎉\n\n---- \n\n## 생성된 링크를 어떻게 사용하나요?\n\n### 1. Markdown 문법 사용하기\n\nNA-Log는 Github-Flavored-Markdown 문법을 지원합니다. \\\nMarkdown 문법을 사용하면 간단하게 이미지를 첨부할 수 있습니다.\n\n```bash\n![비둘기..?
